pre-commit:
  commands:
    fmt:
      # git add 的范围必须与 fmt 的目标一致（package.json 的 fmt 脚本）：
      # 只 add src/ 会让 test/、scripts/、tsdown.*.ts 的格式化改动留在工作区
      run: bun run fmt:all && git add -u src/ test/ scripts/ tsdown.config.ts tsdown.browser.ts tsdown.bin.ts

pre-push:
  scripts:
    "check.sh":
      runner: sh
