name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run ts-check

      - name: Build
        run: bun run build

      - name: Check no handwritten a11y attributes
        run: |
          set +e
          rg --pcre2 '\b(role|aria-[a-z]+)\s*=(?!=)' \
            --glob '*.{tsx,jsx}' \
            --glob '!src/a11y/**' \
            --glob '!src/a11y.ts'
          code=$?
          set -e
          case $code in
            0) echo "handwritten a11y attributes found"; exit 1 ;;
            1) exit 0 ;;
            2) if git ls-files '*.tsx' '*.jsx' | grep -q .; then
                 echo "rg failed with exit 2"; exit 1
               fi
               echo "no tsx/jsx files"; exit 0 ;;
            *) echo "rg failed with exit $code"; exit 1 ;;
          esac

      - name: Test
        run: bun run test
