name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run ts-check

      - name: Build
        run: bun run build

      - name: Check no handwritten a11y attributes
        run: |
          ! rg --pcre2 '\b(role|aria-[a-z]+)\s*=(?!=)' \
            --glob '*.{tsx,jsx}' \
            --glob '!src/a11y/**' \
            --glob '!src/a11y.ts'

      - name: Test
        run: bun run test
